<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0.8; }
      100% { transform: translateY(180px); opacity: 0; }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .grid-bg { fill: url(#grid); }
    .pulse-elem { animation: pulse 2.5s ease-in-out infinite; }
  </style>

  <rect width="1200" height="560" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1200" height="560" rx="16" class="grid-bg" />

  <!-- Top Badge -->
  <g transform="translate(60, 45)">
    <rect width="200" height="26" rx="13" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
    <circle cx="15" cy="13" r="4" fill="#60a5fa" />
    <text x="28" y="17" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="700">WINDOWS SECURITY</text>

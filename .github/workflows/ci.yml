name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check main.js
      - run: node --check preload.js
      - run: node --check renderer.js
      - name: Build portable executable
        run: npm run build -- --config.win.signAndEditExecutable=false
